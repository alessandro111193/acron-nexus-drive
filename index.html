<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070d17"><title>ACRON · NEXUS Drive</title><style>html{background:#030a14;color:#f2fbff;font:16px system-ui}body{display:grid;place-items:center;min-height:100vh;margin:0}.wait{text-align:center}.brand{color:#29c9ff;font-size:26px;letter-spacing:.12em}</style></head><body><div class="wait"><div class="brand">ACRON · NEXUS Drive</div><p>Avvio del cockpit…</p></div><script type="module">
try{const paths=['p0.txt','p1.txt','p2.txt','p3.txt'];const parts=await Promise.all(paths.map(async name=>{const res=await fetch(name);if(!res.ok)throw new Error('Asset mancante: '+name);return await res.text()}));const joined=parts.join('').trim();const data=Uint8Array.from(atob(joined),c=>c.charCodeAt(0));const html=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(error){console.error(error);document.querySelector('.wait').innerHTML='<div class="brand">ACRON NEXUS Drive</div><p>Errore durante l’avvio. Verifica la connessione o aggiorna il browser.</p>'}
</script></body></html>
